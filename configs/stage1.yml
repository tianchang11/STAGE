# Paper-aligned Stage I configuration.
# Early Transformer layers, Adam, LR=8e-4, 180 epochs, batch size 64.
# Run example:
#   CUDA_VISIBLE_DEVICES=0 python train_stage1.py \
#     --config_file configs/stage1.yml \
#     MODEL.DIST_TRAIN False MODEL.DEVICE_ID "('0')"
MODEL:
  PRETRAIN_CHOICE: 'clip'
  PRETRAIN_PATH: 'weights/XXX.pth'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransOSS'
  STRIDE_SIZE: [16, 16]
  MIE: True
  MIE_COE: 1.0
  MIE_POSITION: 'late'
  SSE: False
  PAIR: False
  STAGE: 1
  PATCH_LAYER_GROUP: 'early'

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5  # random horizontal flip
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]

DATASETS:
  NAMES: ('HOSS')
  ROOT_DIR: ('./')

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'Adam'
  MAX_EPOCHS: 180
  BASE_LR: 0.0008
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 10
  LOG_PERIOD: 80
  EVAL_PERIOD: 60
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2
  SEED: 1234

TEST:
  EVAL: True
  IMS_PER_BATCH: 64
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/stage1'
